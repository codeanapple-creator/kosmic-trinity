<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon — shown in browser tab and Google search results -->

    <link rel="shortcut icon" href="/favicon.png" />
    <!-- Apple home-screen icon (iOS Safari) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph — controls the image Google and social platforms show -->
    <meta property="og:title" content="Kosmic Trinity — Vedic Astrology &amp; Spiritual Guidance" />
    <meta property="og:description" content="Vedic astrology, spiritual guidance, and cosmic healing from Prayagraj. Book a session with our expert astrologers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kosmictrinity.in" />
    <meta property="og:image" content="https://kosmictrinity.in/favicon.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:site_name" content="Kosmic Trinity" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kosmic Trinity — Vedic Astrology &amp; Spiritual Guidance" />
    <meta name="twitter:description" content="Vedic astrology, spiritual guidance, and cosmic healing from Prayagraj." />
    <meta name="twitter:image" content="https://kosmictrinity.in/favicon.png" />

    <!--
      Google Fonts — Cinzel + Lato (the two fonts this site actually uses).
      Loaded non-blocking with rel="preload" + onload swap so they never
      stall the page-load event. Android WebViews (incl. Instagram in-app
      browser) keep their loading indicator spinning for every pending
      stylesheet request; making fonts async fixes the perpetual spinner.

      The previous index.html loaded Inter (not used) as a blocking stylesheet
      AND index.css had a render-blocking @import for Cinzel/Lato — two
      separate external requests both counting against page-load completion.
      Both are replaced by this single async preload.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking font load: preload → swap to stylesheet on load -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <!-- Fallback for browsers that don't support preload (rare, but safe) -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
